services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payrecon
      POSTGRES_USER: payrecon
      POSTGRES_PASSWORD: payrecon   # local demo only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payrecon -d payrecon"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payrecon
      DB_USER: payrecon
      DB_PASSWORD: payrecon
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
